# Pipeline configuration (paths are relative to the dataset root)
project:
  name: solar_uav_project
  crs: "EPSG:32649"   # verified on GeoTIFF/GeoPackage headers 2026-09-30
  farm_id: farm_01_thuan_nam_19

inventory:
  raw_images_root: dataset/farm_01_thuan_nam_19/raw_images
  out_dir: dataset/metadata/inventory

module_reference:
  master_gpkg: dataset/farm_01_thuan_nam_19/module_reference/TN19_modules_master.gpkg
  aoi_layer: aoi_boundary
  modules_layer: modules
  ortho_layer: orthophoto_87m   # raster tile layer stored inside the GeoPackage

splits:
  buffer_distance_m: 15.0
  train_ratio: 0.60
  val_ratio: 0.15
  test_ratio: 0.25

models:
  thermal_anomaly:
    task: yolo_obb
    input_size: 640
    classes: [SingleHotSpot, MultiHotSpot, Bypass, ModuleOpenCircuit]  # 416 boxes in 31 frames of one TN19 42M flight; train only
